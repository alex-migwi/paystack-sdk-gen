name: Sync Enriched Spec & Build SDKs

on:
  repository_dispatch:
    types: [enriched-spec-updated] # Triggered automatically when new release of paystack-spec-enriched occurs
  
  workflow_dispatch:                 # Manual trigger with options
    inputs:
      target_languages:
        description: 'Comma-separated target languages e.g typescript, python, go or all (to target all supported langs)'
        type: string
        required: true
      spec_url:
        description: 'Remote Enriched Spec Release URL (Fetched ONLY by GitHub Action)'
        type: string
        required: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    # grant only the minimum permissions needed to open a PR
    permissions:
      contents: write
      pull-requests: write  

    steps:
      - name: Checkout SDK Generator Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Show event payload
        if: ${{ github.event.client_payload.spec_sha }}
        run: |
          echo "Spec SHA: ${{ github.event.client_payload.sha }} || "

      - name: Install Dependencies
        run: npm ci

      - name: Download & Update Local Enriched Spec Copy
        if: ${{ github.event_name == 'repository_dispatch' || github.event.inputs.spec_url }}
        env:
          SPEC_SHA: "${{ github.event.client_payload.sha }}"
          ENRICHED_SPEC_URL: "${{ github.event.client_payload.sha && 'https://raw.githubusercontent.com/alex-migwi/paystack-spec-enriched/${SPEC_SHA}/dist/paystack-enriched.yaml' || github.event.inputs.spec_url }}"
        run: |
          mkdir -p spec
          echo "🌐 GitHub Action fetching spec from remote release: $ENRICHED_SPEC_URL"
          curl -sSL "$ENRICHED_SPEC_URL" -o spec/paystack-enriched.yaml
          echo "✅ Local spec copy updated: spec/paystack-enriched.yaml"
          echo "======================================================================================="
          echo "Validate Spec"
          head -1 spec/paystack-enriched.yaml | grep -qE '^(openapi|swagger):' \
            || { echo "❌ Not a valid OpenAPI spec"; exit 1; }
          grep -q '^paths:' spec/paystack-enriched.yaml \
            || { echo "❌ Missing 'paths'"; exit 1; }

      - name: Generate & Compile Target SDKs from Local Spec Copy
        env:
          TARGET_LANGS: ${{ github.event.inputs.target_languages || 'all' }}
        run: |
          echo "🚀 Generating SDKs from local spec copy for languages: $TARGET_LANGS..."
          npx paystack-sdk-gen generate --lang "$TARGET_LANGS"

      - name: Run Prism Contract Test Validation Suite
        run: |
          echo "🧪 Running Prism Mock Validation against local spec copy..."
          npx paystack-sdk-gen test

      - name: Create Isolated Spec Update PR via GitHub Bot
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: automated update to enriched spec file"
          title: "Automated Spec Update"
          body: "This PR was securely opened by the GitHub Action Bot. It strictly contains updates to enriched sec file."
          branch: "automation/enriched-spec-update"
          base: main
          reviewers: "alex-migwi"
          
          # This discard ANY changes made outside of this explicit path.
          add-paths: |
            spec/paystack-enriched.yaml
            packages/*
